name: Barometry
options:
  bundleIdPrefix: tech.wolff
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BarometryKit:
    path: Packages/BarometryKit
  # Prebuilt xcframework; Xcode embeds it and the developer-id export re-signs
  # its nested code (Autoupdate, Updater.app, XPC services) with our team.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Barometry:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: BarometryKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.wolff.barometry
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's feed and public key, merged into the generated Info.plist.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Barometry
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # App/AppIcon.icon, an Icon Composer document.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Menu bar only: no Dock icon or app menu.
        INFOPLIST_KEY_LSUIElement: YES
        # Sensor access needs IOKit outside the sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Ad-hoc signing for local builds; Scripts/release.sh signs with Developer ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets:
        - package: BarometryKit/BarometryKitTests
